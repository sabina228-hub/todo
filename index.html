<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1 class="app-title">할 일 목록</h1>

    <!-- 저장에 실패하면 표시 -->
    <p id="save-error" class="save-error" role="alert" hidden>저장하지 못했어요. 새로고침하면 바뀐 내용이 사라질 수 있어요.</p>

    <!-- 새 할 일 입력 -->
    <form id="todo-form" class="todo-form">
      <label for="todo-input" class="visually-hidden">새 할 일</label>
      <input id="todo-input" class="todo-input" type="text" maxlength="100" placeholder="할 일을 입력하세요" autocomplete="off">
      <button type="submit" class="add-btn">추가</button>
    </form>

    <!-- 필터 -->
    <div class="filters" role="group" aria-label="목록 필터">
      <button type="button" class="filter-btn" data-filter="all" aria-pressed="true">전체</button>
      <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">진행 중</button>
      <button type="button" class="filter-btn" data-filter="done" aria-pressed="false">완료</button>
    </div>

    <!-- 목록 (app.js가 채움) -->
    <ul id="todo-list" class="todo-list"></ul>
    <p id="empty-message" class="empty-message"></p>

    <!-- 남은 개수, 완료 항목 삭제 -->
    <footer id="todo-footer" class="footer" hidden>
      <span id="remaining-count"></span>
      <button type="button" id="clear-done-btn" class="text-btn text-btn--danger" hidden>완료한 일 삭제</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
